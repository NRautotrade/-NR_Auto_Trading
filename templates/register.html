<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "NR AUTO TRADING" }} - Register</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #071426;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }
        .card {
            width: 100%;
            max-width: 460px;
            background: #0d2038;
            border: 1px solid #1d3b5c;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 18px 50px rgba(0,0,0,.35);
        }
        .brand {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: .5px;
            margin-bottom: 6px;
        }
        .subtitle {
            text-align: center;
            color: #9eb2c8;
            margin-bottom: 26px;
        }
        label {
            display: block;
            margin: 14px 0 7px;
            color: #cbd8e6;
            font-size: 13px;
            font-weight: 700;
        }
        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #31506f;
            border-radius: 9px;
            background: #08182b;
            color: #fff;
            outline: none;
            font-size: 15px;
        }
        input:focus {
            border-color: #4da3ff;
            box-shadow: 0 0 0 2px rgba(77,163,255,.12);
        }
        .error {
            background: #4b1d25;
            border: 1px solid #8d3b48;
            color: #ffd8dd;
            border-radius: 9px;
            padding: 11px 12px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            background: #16a34a;
            color: #fff;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }
        button:hover { background: #15803d; }
        .login {
            text-align: center;
            margin-top: 20px;
            color: #9eb2c8;
            font-size: 14px;
        }
        .login a {
            color: #5eb0ff;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">NR AUTO TRADING</div>
        <div class="subtitle">Create your trading account</div>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/register">
            <label for="username">Username</label>
            <input id="username" name="username" type="text"
                   minlength="3" autocomplete="username" required>

            <label for="email">Email Address</label>
            <input id="email" name="email" type="email"
                   autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   minlength="8" autocomplete="new-password" required>

            <label for="confirm">Confirm Password</label>
            <input id="confirm" name="confirm" type="password"
                   minlength="8" autocomplete="new-password" required>

            <button type="submit">CREATE ACCOUNT</button>
        </form>

        <div class="login">
            Already have an account?
            <a href="/">Log In</a>
        </div>
    </div>
</body>
</html>
