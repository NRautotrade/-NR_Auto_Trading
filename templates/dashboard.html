<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }}</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #10254d 0%, #061329 42%, #020914 100%);
    color: #f4f7fb;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: min(1200px, 94%);
    margin: 0 auto;
    padding: 25px 0 45px;
}

/* HEADER */

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 22px;
    margin-bottom: 20px;
    border: 1px solid #214a7c;
    border-radius: 18px;
    background: rgba(5, 20, 43, .92);
    box-shadow: 0 15px 40px rgba(0,0,0,.28);
}

.brand {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: .5px;
}

.brand-sub {
    color: #83bfff;
    font-size: 12px;
    margin-top: 4px;
}

.user-box {
    text-align: right;
    font-size: 13px;
    color: #aebed4;
}

.user-box strong {
    color: white;
}

.logout {
    display: inline-block;
    margin-top: 7px;
    color: #83bfff;
    text-decoration: none;
    font-size: 12px;
}

/* ACCOUNT */

.account {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
    margin-bottom: 18px;
}

.account-card {
    border: 1px solid #214a7c;
    border-radius: 16px;
    background: rgba(6, 24, 50, .92);
    padding: 18px;
}

.label {
    color: #83bfff;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .7px;
    margin-bottom: 8px;
}

.value {
    font-size: 20px;
    font-weight: 800;
}

.connected {
    color: #22e57a;
}

/* MAIN GRID */

.main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.panel {
    border: 1px solid #214a7c;
    border-radius: 18px;
    background: rgba(5, 21, 45, .94);
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 12px 35px rgba(0,0,0,.2);
}

.panel-title {
    color: #8bc2ff;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: .5px;
    margin-bottom: 18px;
}

/* BUTTONS */

button,
.button {
    border: 0;
    border-radius: 11px;
    padding: 14px 18px;
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    background: #20e477;
    color: #03120b;
}

button:hover,
.button:hover {
    filter: brightness(1.08);
}

.danger {
    background: #ff666d;
    color: #180306;
}

.disabled {
    background: #26364c;
    color: #788ba5;
    cursor: not-allowed;
}

.button-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

/* MARKET GRID */

.market-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
}

.market {
    position: relative;
}

.market input {
    position: absolute;
    opacity: 0;
}

.market span {
    display: block;
    padding: 13px 10px;
    border: 1px solid #274d78;
    border-radius: 10px;
    text-align: center;
    color: #c8d6e8;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    background: #091a34;
}

.market input:checked + span {
    border-color: #20e477;
    background: rgba(32,228,119,.12);
    color: #20e477;
}

/* STRATEGIES */

.strategy-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
}

.strategy {
    position: relative;
}

.strategy input {
    position: absolute;
    opacity: 0;
}

.strategy span {
    display: block;
    padding: 14px 7px;
    text-align: center;
    border: 1px solid #274d78;
    border-radius: 10px;
    background: #091a34;
    color: #c8d6e8;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
}

.strategy input:checked + span {
    background: rgba(32,228,119,.12);
    border-color: #20e477;
    color: #20e477;
}

/* RISK */

.fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 13px;
}

.field label {
    display: block;
    color: #aebed4;
    font-size: 12px;
    font-weight: 700;
}

.field input {
    width: 100%;
    margin-top: 7px;
    padding: 12px;
    border-radius: 9px;
    border: 1px solid #2b527e;
    background: #07172d;
    color: white;
    font-size: 15px;
    font-weight: 700;
    outline: none;
}

.field input:focus {
    border-color: #20e477;
}

/* TIMEFRAME */

.locked {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    border-radius: 11px;
    background: #091a34;
    border: 1px solid #274d78;
}

.locked strong {
    color: white;
}

.lock {
    color: #20e477;
    font-weight: 900;
}

/* BOT */

.bot-status {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 21px;
    font-weight: 900;
    margin-bottom: 12px;
}

.status-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #777;
}

.running .status-dot {
    background: #20e477;
    box-shadow: 0 0 12px rgba(32,228,119,.8);
}

.running .status-text {
    color: #20e477;
}

.bot-message {
    padding: 13px;
    border-radius: 10px;
    background: #07172d;
    color: #9fb1c9;
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 14px;
}

/* TRADE */

.trade-box {
    border: 1px solid #274d78;
    border-radius: 12px;
    background: #07172d;
    padding: 15px;
}

.trade-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,.06);
    font-size: 13px;
}

.trade-row:last-child {
    border-bottom: 0;
}

.trade-row span:first-child {
    color: #8298b4;
}

.trade-row span:last-child {
    color: white;
    font-weight: 800;
    text-align: right;
}

.profit {
    color: #20e477 !important;
}

.loss {
    color: #ff666d !important;
}

/* SAVE */

.save-btn {
    width: 100%;
    margin-top: 3px;
    font-size: 15px;
    padding: 16px;
}

/* NOTICE */

.notice {
    padding: 12px;
    border-radius: 10px;
    background: rgba(255,255,255,.035);
    color: #8298b4;
    font-size: 12px;
    line-height: 1.5;
}

.error {
    border: 1px solid #ff666d;
    background: rgba(255,102,109,.12);
    color: #ff9ca1;
    padding: 13px;
    border-radius: 10px;
    margin-bottom: 18px;
}

.success {
    border: 1px solid #20e477;
    background: rgba(32,228,119,.10);
    color: #20e477;
    padding: 13px;
    border-radius: 10px;
    margin-bottom: 18px;
}

/* MOBILE */

@media (max-width: 800px) {

    .main-grid {
        grid-template-columns: 1fr;
    }

    .account {
        grid-template-columns: 1fr;
    }

    .topbar {
        padding: 15px;
    }

    .brand {
        font-size: 20px;
    }

    .fields {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 480px) {

    .container {
        width: 94%;
        padding-top: 12px;
    }

    .market-grid {
        grid-template-columns: 1fr 1fr;
    }

    .strategy-grid {
        grid-template-columns: 1fr;
    }

    .button-row {
        grid-template-columns: 1fr;
    }

    .panel {
        padding: 16px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="topbar">
        <div>
            <div class="brand">NR AUTO TRADING</div>
            <div class="brand-sub">AUTOMATED TRADING SYSTEM</div>
        </div>

        <div class="user-box">
            <strong>{{ user["username"] }}</strong><br>
            {% if connection %}
                {{ connection["account_type"]|upper }} ACCOUNT
            {% else %}
                ACCOUNT NOT CONNECTED
            {% endif %}
            <br>
            <a class="logout" href="/logout">LOGOUT</a>
        </div>
    </div>


    <!-- ACCOUNT / TODAY -->

<section class="account-today">

    <div class="account-today-title">
        ACCOUNT / TODAY
    </div>

    <div class="account-today-grid">

        <div class="today-stat">
            <div class="today-label">BALANCE</div>
            <div class="today-value" id="dashBalance">—</div>
        </div>

        <div class="today-stat">
            <div class="today-label">EQUITY</div>
            <div class="today-value" id="dashEquity">—</div>
        </div>

        <div class="today-stat">
            <div class="today-label">TODAY'S P/L</div>
            <div class="today-value profit" id="dashTodayPL">
                $0.00
            </div>
        </div>

        <div class="today-stat">
            <div class="today-label">OPEN TRADES</div>
            <div class="today-value" id="dashOpenTrades">
                0
            </div>
        </div>

        <div class="today-stat">
            <div class="today-label">WINS</div>
            <div class="today-value" id="dashWins">
                0
            </div>
        </div>

        <div class="today-stat">
            <div class="today-label">LOSSES</div>
            <div class="today-value" id="dashLosses">
                0
            </div>
        </div>

    </div>

</section>
